name = "wwd-referee"
main = "src/worker.ts"
compatibility_date = "2026-11-04"
send_metrics = false

# The engine package exports its WebAssembly under a specifier without a `.wasm` extension.
[[rules]]
type = "CompiledWasm"
globs = ["@wwd/engine/wasm"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = ""
TEST_OVERRIDES = "0"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[env.staging]
name = "wwd-referee-staging"

[env.staging.vars]
# Empty lets no browser in; deploys pass the real list with --var ALLOWED_ORIGINS:<origins>.
ALLOWED_ORIGINS = ""
TEST_OVERRIDES = "0"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[env.production]
name = "wwd-referee"

[env.production.vars]
# Empty lets no browser in; deploys pass the real list with --var ALLOWED_ORIGINS:<origins>.
ALLOWED_ORIGINS = ""
TEST_OVERRIDES = "0"

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"
