[package]
name = "wwd-core"
description = "Deterministic rules engine for Werewolf: Duel!"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
unsafe-edit = []
fuzz = ["dep:serde_json"]
ts = ["dep:ts-rs"]

[dependencies]
blake3 = "1.8.7"
postcard = { version = "1.2.0", features = ["use-std"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[[test]]
name = "fuzz"
required-features = ["fuzz"]

[[test]]
name = "ui_helpers"
required-features = ["fuzz", "unsafe-edit"]
