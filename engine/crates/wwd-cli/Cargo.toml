[package]
name = "wwd-cli"
description = "Command-line driver for the Werewolf: Duel! engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wwd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
fluent-bundle = "0.16.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unic-langid = "0.9.6"
wwd-core = { path = "../wwd-core", features = ["fuzz", "unsafe-edit"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
